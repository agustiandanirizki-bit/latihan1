
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHRTNS</title>
    <!-- Link untuk Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Link untuk Font Cairo dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Link ke file CSS terpisah -->
    <link rel="stylesheet" href="style.css">

    <!-- Stylesheet Quill -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
</head>
<body>

    <!-- HEADER (Sticky dengan efek Glass Blur) -->
    <header class="site-header">
        <h2 class="logo">SHRTNS'S ART</h2>

<!-- Kolom Pencarian Baru -->
  <div class="header-search">
    <input type="text" placeholder="Ketikan disini..." class="search-input">
  </div>

        <!-- Tombol Add Story memicu fungsi openModal() -->
        <a href="#" class="btn-add" onclick="openModal(); return false;">
            <i class="fa-solid fa-plus"></i> Add Story
        </a>


        
    </header>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
        <div class="container" id="card-container"></div>
    </main>

    <!-- MODAL DIALOG UNTUK ADD STORY -->
    <div id="storyModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
      <div style="background:white; padding:20px; width:600px; border-radius:8px;">
        <h3>Tambah Cerita Baru</h3>
        
        <!-- Input Judul & Genre -->
        <input type="text" id="storyTitle" placeholder="Judul..." style="width:100%; margin-bottom:10px; padding:8px;" />
        <input type="text" id="storyGenre" placeholder="Genre..." style="width:100%; margin-bottom:10px; padding:8px;" />
        <input type="text" id="storyImage" placeholder="URL Gambar..." style="width:100%; margin-bottom:10px; padding:8px;" />

        <!-- Container untuk Rich Text Editor (Ringkasan/Isi) -->
        <div id="editor-container" style="height: 150px; margin-bottom: 10px;"></div>

        <!-- Tombol Aksi -->
        <button onclick="saveStory()">Simpan</button>
        <button onclick="closeModal()">Batal</button>
      </div>
    </div>

    <!-- FOOTER (Paling bawah setelah seluruh konten selesai) -->
    <footer class="site-footer">
        <p>&copy; 2026 SHRTNS. All rights reserved.</p>
    </footer>

    <!-- SCRIPT LIBRARY & FILE EKSTERNAL -->
    <!-- Script Quill.js -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <!-- File JavaScript terpisah (script.js) untuk Modal & Quill -->
    <script src="script.js"></script>
</body>
</html>
